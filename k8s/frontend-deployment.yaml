apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: vehicle-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: gayanscorpio/vehicle-frontend:1.0.7
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: VITE_GRAPHQL_ENDPOINT
              value: http://backend:8080/graphql
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: vehicle-app
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
